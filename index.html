<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Empire</title>
<style>
:root{--bg:#070b14;--panel:#101827;--panel2:#182235;--text:#f8fafc;--muted:#94a3b8;--green:#34d399;--gold:#fbbf24;--blue:#60a5fa;--danger:#fb7185;--common:#94a3b8;--uncommon:#34d399;--rare:#60a5fa;--epic:#c084fc;--legendary:#fbbf24}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% -5%,#2563eb3d,transparent 34%),radial-gradient(circle at 90% 8%,#f59e0b22,transparent 27%),linear-gradient(180deg,#07101f,var(--bg))}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.42}.app{width:min(1220px,100%-28px);margin:auto;padding:22px 0 46px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:17px}h1{font-size:clamp(3rem,11vw,5.7rem);line-height:.82;margin:0 0 10px;letter-spacing:-.09em;text-transform:uppercase}.tagline{margin:0;color:var(--muted);font-size:.98rem;line-height:1.45}.top-actions{display:grid;justify-items:end;gap:9px;flex-shrink:0}.market,.reset{border:1px solid #ffffff18;border-radius:999px;padding:10px 13px}.market{background:#ffffff10;color:var(--muted);white-space:nowrap}.market strong{color:var(--text);font-weight:900}.reset{background:#fb71851c;color:#fecdd3;font-weight:850}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:17px}.stat{display:flex;align-items:center;gap:10px;min-width:0;padding:12px;border:1px solid #ffffff13;border-radius:18px;background:linear-gradient(145deg,#ffffff10,#ffffff06);box-shadow:0 14px 30px #00000030}.icon-bubble{display:grid;place-items:center;width:35px;height:35px;flex:none;border-radius:12px;background:#ffffff10}.stat small{display:block;color:var(--muted);font-size:.66rem;font-weight:850;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}.stat strong{display:block;overflow:hidden;max-width:100%;font-size:clamp(1.08rem,3.8vw,1.65rem);line-height:1.1;letter-spacing:-.04em;text-overflow:ellipsis;white-space:nowrap}.cash strong{color:var(--green)}.steps{display:flex;gap:8px;margin-bottom:18px}.step{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid #ffffff12;border-radius:999px;background:#ffffff09;color:#dbeafe;font-size:.79rem;font-weight:800;white-space:nowrap}.step b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#3b82f633;color:#bfdbfe;font-size:.68rem}.layout{display:grid;grid-template-columns:minmax(0,1fr)365px;gap:16px;align-items:start}.section{padding:16px;border:1px solid #ffffff12;border-radius:24px;background:#101827cf;box-shadow:0 18px 45px #00000038;backdrop-filter:blur(14px)}.shop{margin-bottom:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:13px}.section h2{margin:0;font-size:1.17rem;letter-spacing:-.025em}.counter{padding:6px 10px;border-radius:999px;background:#3b82f61d;color:#bfdbfe;font-size:.76rem;font-weight:900;white-space:nowrap}.lots{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.lot{position:relative;min-height:212px;padding:15px;overflow:hidden;border:1px solid #ffffff16;border-radius:21px;background:linear-gradient(145deg,var(--panel2),#0c1322)}.lot:before{position:absolute;inset:0;content:"";background:linear-gradient(115deg,transparent 18%,#ffffff0a 31%,transparent 44%),radial-gradient(circle at 76% 18%,var(--lotglow),transparent 32%);pointer-events:none}.lot.starter{--lotglow:#3b82f62b}.lot.premium{--lotglow:#f59e0b30}.pack{position:relative;width:95px;height:122px;margin:auto;overflow:hidden;border:1px solid #ffffff22;border-radius:13px;background:linear-gradient(160deg,#1e293b,#0f172a);box-shadow:0 11px 24px #0009}.pack:before{position:absolute;inset:0;content:"";background:radial-gradient(circle at 18% 16%,var(--packcolor) 0 13%,transparent 14%),radial-gradient(circle at 78% 63%,var(--packcolor) 0 10%,transparent 11%),repeating-linear-gradient(45deg,#ffffff07 0 8px,transparent 8px 16px)}.pack:after{position:absolute;top:12px;right:-45px;width:130px;height:45px;content:"";background:linear-gradient(90deg,transparent,#ffffff24,transparent);transform:rotate(38deg)}.starter .pack{--packcolor:#60a5fa}.premium .pack{--packcolor:#fbbf24}.pack-symbol{position:relative;display:grid;place-items:center;height:83px;font-size:2.2rem}.pack-name{position:relative;display:grid;place-items:center;height:39px;color:#e2e8f0;font-size:.62rem;font-weight:950;letter-spacing:.07em;text-align:center;text-transform:uppercase}.lot-content{position:relative;display:grid;gap:12px;text-align:center}.lot h3{margin:0;font-size:1.06rem}.lot-meta{display:flex;justify-content:center;gap:7px;color:var(--muted);font-size:.78rem;font-weight:750}.buy,.sell{border-radius:14px;padding:13px 16px;font-weight:950;box-shadow:0 9px 22px #00000030}.buy{justify-self:center;background:var(--blue);color:#03101d}.sell{width:100%;background:var(--green);color:#03110d}.locked{position:relative;padding:11px 12px;border-radius:13px;background:#0000007a;color:#cbd5e1;font-size:.82rem;line-height:1.4}.inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:11px;min-height:170px}.empty{grid-column:1/-1;display:grid;place-items:center;min-height:170px;border:1px dashed #ffffff2a;border-radius:18px;color:var(--muted);text-align:center;line-height:1.5}.tile{position:relative;display:block;width:100%;overflow:hidden;padding:0;border:3px solid transparent;border-radius:17px;background:transparent;transition:transform .16s ease,filter .16s ease}.tile:hover{transform:translateY(-3px);filter:brightness(1.06)}.tile.selected{border-color:var(--gold);box-shadow:0 0 0 3px #fbbf2428,0 13px 32px #00000047}.face,.backface{position:relative;display:flex;flex-direction:column;width:100%;aspect-ratio:3/4.14;overflow:hidden;border-radius:14px;text-align:left}.face{border:1px solid var(--rarity);background:radial-gradient(circle at 50% 31%,#ffffff17,transparent 34%),linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 0 0 2px #ffffff12,inset 0 -35px 55px #0000003d}.face:before{position:absolute;left:-70%;top:-20%;width:60%;height:145%;content:"";background:linear-gradient(90deg,transparent,#ffffff2c,transparent);transform:rotate(24deg)}.face:after{position:absolute;inset:6px;content:"";pointer-events:none;border:1px solid #ffffff2c;border-radius:10px}.Common{--rarity:var(--common)}.Uncommon{--rarity:var(--uncommon)}.Rare{--rarity:var(--rare)}.Epic{--rarity:var(--epic)}.Legendary{--rarity:var(--legendary)}.ribbon{position:relative;z-index:1;display:flex;align-items:center;gap:5px;padding:8px 9px;background:#03071259;font-size:.56rem;font-weight:950;letter-spacing:.07em;text-transform:uppercase}.ribbon b{overflow:hidden;max-width:100%;color:var(--rarity);text-overflow:ellipsis;white-space:nowrap}.ribbon span{width:20px}.visual{position:relative;z-index:1;display:grid;place-items:center;flex:1;overflow:hidden}.visual:before{position:absolute;width:110%;height:110%;content:"";background:repeating-conic-gradient(from 15deg,#ffffff0d 0 8deg,transparent 8deg 18deg);opacity:.65;border-radius:50%;transform:scale(1.3)}.visual .ring{position:absolute;width:78%;aspect-ratio:1;border:2px solid #ffffff22;border-radius:50%;background:radial-gradient(circle,#ffffff16,transparent 58%)}.visual .symbol{position:relative;font-size:clamp(2rem,12vw,3.15rem);filter:drop-shadow(0 10px 14px #0008)}.title-wrap{position:relative;z-index:1;min-height:68px;padding:10px 9px;background:linear-gradient(180deg,#03071259,#030712c9)}.card-name{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:.74rem;font-weight:950;line-height:1.22}.condition{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:999px;background:#ffffff13;color:#e2e8f0;font-size:.56rem;font-weight:850}.backface{align-items:center;justify-content:center;gap:12px;border:1px solid #60a5fa3f;background:radial-gradient(circle at 50% 34%,#60a5fa30,transparent 38%),repeating-linear-gradient(45deg,#27344b 0 9px,#1c293e 9px 18px)}.backface:before{position:absolute;inset:7px;content:"";border:1px solid #ffffff2d;border-radius:10px}.medallion{display:grid;place-items:center;width:66px;height:66px;border:2px solid #fbbf2454;border-radius:50%;background:linear-gradient(145deg,#111827,#1d4ed84f);color:#fde68a;font-size:1.25rem;font-weight:1000;letter-spacing:-.07em;box-shadow:0 0 34px #3b82f628}.inspect-label{color:#e2e8f0;font-size:.63rem;font-weight:950;letter-spacing:.11em;text-transform:uppercase}.side{display:grid;gap:16px}.detail-card{width:min(100%,275px);margin:auto}.detail-card .face{font-size:1rem;box-shadow:inset 0 0 0 2px #ffffff16,inset 0 -50px 75px #00000047,0 20px 45px #0008}.detail-card .ribbon{padding:12px;font-size:.68rem}.detail-card .visual .symbol{font-size:4.1rem}.detail-card .title-wrap{min-height:88px;padding:13px}.detail-card .card-name{font-size:.93rem}.detail-card .condition{font-size:.65rem}.detail-stats{display:grid;gap:8px;margin-top:14px}.detail-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff0f}.detail-row span:first-child{color:var(--muted)}.gold{color:var(--gold);font-weight:900}.green{color:var(--green);font-weight:950}.empty-details{display:grid;place-items:center;min-height:280px;padding:23px;border:1px dashed #ffffff24;border-radius:20px;color:var(--muted);text-align:center;font-size:.91rem}.log{display:grid;gap:8px;max-height:270px;margin:12px 0 0;padding:0;overflow:auto;list-style:none}.log li{display:flex;gap:8px;align-items:flex-start;padding:10px;border-left:3px solid var(--blue);border-radius:10px;background:#0000004a;color:#dbe4ef;font-size:.81rem;line-height:1.38}.log .earn{border-color:var(--green)}.log .unlock{border-color:var(--gold)}
@media(max-width:920px){.stats{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.side{order:-1}.detail-card{width:min(78vw,310px)}}
@media(max-width:570px){.app{width:min(100%-20px,1220px);padding-top:15px}.top{align-items:stretch;flex-direction:column}.top-actions{grid-template-columns:1fr auto;align-items:center;justify-items:stretch}.market{text-align:center}.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:1/-1}.steps{width:100%;overflow:auto;padding-bottom:3px}.step{flex:none}.lots{grid-template-columns:1fr}.inventory{grid-template-columns:repeat(3,1fr);gap:8px}.counter{display:none}.detail-card{width:min(82vw,300px)}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><h1>Card Empire</h1><p class="tagline">Build a collectibles business from raw inventory to premium chase cards.</p></div><div class="top-actions"><div class="market">Market <strong id="market">+0%</strong></div><button class="reset" id="reset" type="button">↺ Reset</button></div></header>
<section class="stats"><div class="stat cash"><div class="icon-bubble">💵</div><div><small>Cash</small><strong id="cash">$100</strong></div></div><div class="stat"><div class="icon-bubble">🃏</div><div><small>Inventory</small><strong id="count">0</strong></div></div><div class="stat"><div class="icon-bubble">🏷️</div><div><small>Sold</small><strong id="sold">0</strong></div></div><div class="stat"><div class="icon-bubble">📈</div><div><small>Earnings</small><strong id="earnings">$0</strong></div></div><div class="stat"><div class="icon-bubble">⭐</div><div><small>Average</small><strong id="average">$0</strong></div></div></section>
<div class="steps"><div class="step"><b>1</b>📦 Buy lots</div><div class="step"><b>2</b>👆 Inspect cards</div><div class="step"><b>3</b>💰 Sell selectively</div><div class="step"><b>4</b>✨ Unlock premium</div></div>
<div class="layout"><div><section class="section shop"><div class="section-head"><h2>Shop</h2></div><div class="lots" id="lots"></div></section><section class="section"><div class="section-head"><h2>Inventory</h2><span class="counter" id="remaining">0 cards</span></div><div class="inventory" id="inventory"></div></section></div><aside class="side"><section class="section"><div class="section-head"><h2>Inspection</h2></div><div id="details"></div></section><section class="section"><div class="section-head"><h2>Activity</h2></div><ul class="log" id="log"></ul></section></aside></div>
</main>
<script>
"use strict";
const LOTS=[{id:"starter",name:"Starter Bulk",icon:"📦",cost:25,count:10,min:4,max:28,className:"starter",rarity:{Common:44,Uncommon:31,Rare:17,Epic:6,Legendary:2}},{id:"better",name:"Premium Chase",icon:"✨",cost:85,count:12,min:16,max:120,className:"premium",rarity:{Common:27,Uncommon:30,Rare:26,Epic:11,Legendary:6}}];
const MULT={Common:.48,Uncommon:.8,Rare:1.45,Epic:3,Legendary:6.2},ERR={Common:.1,Uncommon:.14,Rare:.2,Epic:.3,Legendary:.42};
const CONDITIONS=[["Poor","POOR",10,.35],["Played","PLAYED",20,.55],["Good","GOOD",30,.75],["Near Mint","NM",29,1],["Gem Mint","GEM",11,1.28]];
const CARDS={starter:[["⚾","Diamond Ace Rookie"],["🏀","Sky Court Rookie"],["🏈","Blitz Captain"],["⚽","Golden Boot Hopeful"],["✨","Ember Drake"],["🌟","Aqua Sprite"],["🏆","Rising Prospect"]],better:[["⚾","Franchise Ace Autograph"],["🏀","Rookie Icon Refractor"],["🏈","Championship Signal Caller"],["⚽","Global Superstar Red"],["🔥","Ember Drake Holo"],["☄️","Cosmic Guardian Secret"],["👑","Legendary Rookie Relic"]]};
const ART={"⚾":["#3b82f6","#0f3b75"],"🏀":["#f97316","#7c2d12"],"🏈":["#a16207","#3f2a0b"],"⚽":["#22c55e","#14532d"],"✨":["#dc2626","#4c0519"],"🌟":["#0891b2","#164e63"],"🏆":["#eab308","#713f12"],"🔥":["#ef4444","#7f1d1d"],"☄️":["#8b5cf6","#312e81"],"👑":["#f59e0b","#78350f"],"📦":["#64748b","#1e293b"]};
const el=id=>document.getElementById(id),money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n);
let state={cash:100,inventory:[],selected:null,sold:0,earnings:0,market:1,unlocked:false,nextId:1,log:[]};
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function weighted(obj){let total=Object.values(obj).reduce((a,b)=>a+b,0),roll=Math.random()*total;for(let key in obj){roll-=obj[key];if(roll<=0)return key}return Object.keys(obj).at(-1)}
function condition(){let total=CONDITIONS.reduce((a,c)=>a+c[2],0),roll=Math.random()*total;for(let c of CONDITIONS){roll-=c[2];if(roll<=0)return c}return CONDITIONS.at(-1)}
function createCard(lot){let item=pick(CARDS[lot.id]),rarity=weighted(lot.rarity),cond=condition(),value=Math.max(1,Math.round(rnd(lot.min,lot.max)*MULT[rarity]*cond[3]*rnd(.9,1.1))),err=ERR[rarity],colors=ART[item[0]]||ART["📦"];return{id:state.nextId++,icon:item[0],name:item[1],rarity,conditionName:cond[0],conditionShort:cond[1],value,low:Math.max(1,Math.round(value*(1-err))),high:Math.round(value*(1+err)),c1:colors[0],c2:colors[1],revealed:false}}
function offer(card){return Math.max(1,Math.round(card.value*state.market))}function note(text,type="info",icon="•"){state.log.unshift({text,type,icon});state.log=state.log.slice(0,9)}
function buy(id){let lot=LOTS.find(x=>x.id===id);if(!lot||state.cash<lot.cost)return;if(id==="better"&&!state.unlocked)return;state.cash-=lot.cost;state.market=rnd(.92,1.12);for(let i=0;i<lot.count;i++)state.inventory.push(createCard(lot));note(`${lot.count} sealed cards added from ${lot.name}`,"info",lot.icon);render()}
function inspect(id){let card=state.inventory.find(x=>x.id===id);if(!card)return;if(!card.revealed){card.revealed=true;note(`${card.rarity} • ${card.conditionName}`, "info",card.icon)}state.selected=id;render()}
function sell(){let index=state.inventory.findIndex(x=>x.id===state.selected);if(index<0)return;let card=state.inventory[index],price=offer(card);state.inventory.splice(index,1);state.cash+=price;state.sold++;state.earnings+=price;state.selected=null;note(`Sale complete • ${money(price)}`,"earn","💰");if(!state.unlocked&&state.sold>=10){state.unlocked=true;note("Premium Chase lots unlocked","unlock","✨")}render()}
function reset(){if(!confirm("Reset Card Empire and return to $100?"))return;state={cash:100,inventory:[],selected:null,sold:0,earnings:0,market:1,unlocked:false,nextId:1,log:[]};note("New business started","info","🏁");render()}
function pct(m){let p=Math.round((m-1)*100);return (p>=0?"+":"")+p+"%"}
function render(){el("cash").textContent=money(state.cash);el("count").textContent=state.inventory.length;el("remaining").textContent=state.inventory.length+" cards";el("sold").textContent=state.sold;el("earnings").textContent=money(state.earnings);el("average").textContent=money(state.sold?Math.round(state.earnings/state.sold):0);el("market").textContent=pct(state.market);renderLots();renderInventory();renderDetails();renderLog()}
function renderLots(){el("lots").innerHTML=LOTS.map(lot=>{let locked=lot.id==="better"&&!state.unlocked,action=locked?`<div class="locked">✨ ${Math.min(state.sold,10)}/10 sales to unlock</div>`:`<button class="buy" data-lot="${lot.id}" ${state.cash>=lot.cost?"":"disabled"}>${lot.icon} Buy ${money(lot.cost)}</button>`;return `<article class="lot ${lot.className}"><div class="lot-content"><div class="pack"><div class="pack-symbol">${lot.icon}</div><div class="pack-name">${lot.name}</div></div><div><h3>${lot.name}</h3><div class="lot-meta"><span>${lot.count} cards</span><span>•</span><span>${money(lot.cost)}</span></div></div>${action}</div></article>`}).join("")}
function cardFace(card){return `<div class="face ${card.rarity}" style="--c1:${card.c1};--c2:${card.c2}"><div class="ribbon"><span>${card.icon}</span><b>${card.rarity}</b></div><div class="visual"><div class="ring"></div><div class="symbol">${card.icon}</div></div><div class="title-wrap"><div class="card-name">${card.name}</div><div class="condition">${card.conditionShort}</div></div></div>`}
function renderInventory(){if(!state.inventory.length){el("inventory").innerHTML=`<div class="empty">📦<br>No cards in inventory</div>`;return}el("inventory").innerHTML=state.inventory.map(card=>card.revealed?`<button class="tile ${card.id===state.selected?"selected":""}" data-card="${card.id}" aria-label="Review ${card.name}">${cardFace(card)}</button>`:`<button class="tile" data-card="${card.id}" aria-label="Inspect sealed card"><div class="backface"><div class="medallion">CE</div><div class="inspect-label">Inspect</div></div></button>`).join("")}
function renderDetails(){let card=state.inventory.find(x=>x.id===state.selected);if(!card||!card.revealed){el("details").innerHTML=`<div class="empty-details"><div><div style="font-size:3rem">🔍</div>Select a card<br>to inspect it</div></div>`;return}let price=offer(card);el("details").innerHTML=`<div class="detail-card">${cardFace(card)}</div><div class="detail-stats"><div class="detail-row"><span>Condition</span><b>${card.conditionName}</b></div><div class="detail-row"><span>Estimate</span><b class="gold">${money(card.low)}–${money(card.high)}</b></div><div class="detail-row"><span>Offer</span><b class="green">${money(price)}</b></div><button class="sell" id="sellButton">Sell ${money(price)}</button></div>`}
function renderLog(){el("log").innerHTML=state.log.map(x=>`<li class="${x.type}"><span>${x.icon}</span><span>${x.text}</span></li>`).join("")}
el("lots").onclick=e=>{let b=e.target.closest("[data-lot]");if(b)buy(b.dataset.lot)};el("inventory").onclick=e=>{let b=e.target.closest("[data-card]");if(b)inspect(Number(b.dataset.card))};el("details").onclick=e=>{if(e.target.closest("#sellButton"))sell()};el("reset").onclick=reset;note("New business started","info","🏁");render();
</script>
</body>
</html>

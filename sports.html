<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Empire Sports</title><style>*{box-sizing:border-box}body{margin:0;background:#091322;color:#f1f5f9;font:16px system-ui}main{max-width:700px;margin:auto;padding:18px 12px 60px}button,select{font:inherit;padding:13px;border:0;border-radius:12px;background:#21324b;color:white;min-height:44px}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{padding:10px;border-radius:12px;background:#173453;font-size:12px;min-height:140px;display:flex;flex-direction:column;gap:8px}dialog{width:min(94vw,420px);border:0;border-radius:24px;background:#101f33;color:white;padding:22px}dialog::backdrop{background:#020617df}</style><main><h1>Card Empire Sports</h1><b id="cash"></b><p>640 fictional athletes. Most packs lose money.</p><select id="sport"><option>baseball</option><option>basketball</option><option>football</option><option>soccer</option></select><button id="buy">5 cards · 5 coins</button><button id="work">Sort inventory · +1 coin</button><h2>Binder</h2><div id="binder" class="grid"></div></main><dialog id="reveal"><div id="pull"></div><button id="next">Next</button></dialog><script>'use strict';const $=x=>document.getElementById(x),sports=['baseball','basketball','football','soccer'],first='Arden Soren Kellan Tavian Lucian Miren Orion Caspian Evren Zephyr Isolde Rhea Nyx Cyrus Elara Vesper Thorne Cassian Aster Ronan Lyra Jasper Callum Nola Sable Ezra Indigo Kairo Marlow Selene Atlas Dario'.split(' '),last='Corvane Ashmantle Stormoak Valehart Emberglass Silverquill Ironreach Nightgale Rookborne Skyforge Grimcrown Sunharvest Ironweaver Hollowspire Brightmoor Wolfcaster Mistral Grayspire Larkspur Everstride'.split(' '),tiers=['Prospect','Prospect','Prospect','Prospect','Prospect','Young Core','Young Core','Star','Superstar','Legend'],weights=[12,12,12,12,12,8,8,4,1,.2],values=[.3,.3,.3,.3,.3,.6,.6,1.5,6,14],par=[['Base',0,9200,1],['Silver Spectrum',0,650,2],['Blue Pulse',199,85,5],['Violet Current',99,35,8],['Gold Crown',50,18,16],['Ember Cut',25,8,28],['Obsidian',10,2.8,55],['Crimson Edge',5,1,100],['Crown Masterpiece',1,.2,300]];const players=sports.flatMap((sport,s)=>Array.from({length:160},(_,i)=>{let n=s*160+i;return{id:sport+'-'+i,name:first[n%32]+' '+last[Math.floor(n/32)],sport,tier:tiers[i%10],weight:weights[i%10],value:values[i%10]}}));let state={cash:100,inv:[],pending:[],prints:{},next:1},index=0;try{let s=JSON.parse(localStorage.getItem('empireSportsSimple'));if(s&&Array.isArray(s.inv)&&Array.isArray(s.pending))state=s}catch(e){}function save(){try{localStorage.setItem('empireSportsSimple',JSON.stringify(state))}catch(e){}}function draw(a,w){let r=Math.random()*a.reduce((n,x)=>n+w(x),0);for(let x of a){r-=w(x);if(r<0)return x}return a.at(-1)}function card(){let p=draw(players.filter(x=>x.sport===$('sport').value),x=>x.weight),auto=['Star','Superstar','Legend'].includes(p.tier)&&Math.random()<.01;let key=v=>p.id+'|'+v[0]+'|'+auto,v=draw(par.filter(v=>!v[1]||(state.prints[key(v)]||0)<v[1]),v=>v[2]),serial='';if(v[1]){let k=key(v);state.prints[k]=(state.prints[k]||0)+1;serial=state.prints[k]+'/'+v[1]}return{...p,id:state.next++,variant:v[0],serial,auto,value:Math.round(p.value*v[3]*(auto?8:1)*100)/100}}function face(c){return '<b>'+c.name+'</b><span>'+c.sport+' · '+c.tier+'</span><span>'+c.variant+' '+c.serial+(c.auto?' AUTO':'')+'</span>'}function render(){$('cash').textContent=state.cash.toFixed(2)+' coins';$('buy').disabled=state.cash<5||state.pending.length>0;$('binder').innerHTML=state.inv.map(c=>'<div class="card">'+face(c)+'<button data-id="'+c.id+'">Sell '+c.value.toFixed(2)+'</button></div>').join('')}function reveal(){if(!$('reveal').open)$('reveal').showModal();$('pull').innerHTML='<div class="card">'+face(state.pending[index])+'</div>';$('next').textContent=index===state.pending.length-1?'Keep pack':'Next card'}$('buy').onclick=()=>{if(state.cash<5||state.pending.length)return;state.cash=Math.round((state.cash-5)*100)/100;state.pending=Array.from({length:5},card);index=0;save();render();reveal()};$('next').onclick=()=>{if(++index<state.pending.length){reveal();return}state.inv.unshift(...state.pending);state.pending=[];save();$('reveal').close();render()};$('reveal').addEventListener('cancel',e=>e.preventDefault());$('binder').onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;let i=state.inv.findIndex(c=>c.id===Number(b.dataset.id));if(i<0)return;state.cash=Math.round((state.cash+state.inv[i].value)*100)/100;state.inv.splice(i,1);save();render()};$('work').onclick=()=>{$('work').disabled=true;setTimeout(()=>{state.cash=Math.round((state.cash+1)*100)/100;save();render();$('work').disabled=false},3000)};render();if(state.pending.length)reveal();</script></html>

<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Empire Sports</title><style>*{box-sizing:border-box}body{margin:0;background:#081320;color:#eef5ff;font:15px system-ui}main{max-width:720px;margin:auto;padding:20px 14px 70px}button,select{font:inherit;border:0;border-radius:14px;padding:13px;background:#243a54;color:white;min-height:46px}button:disabled{opacity:.4}.hero{background:linear-gradient(120deg,#214b74,#251843);border-radius:25px;padding:24px;margin:15px 0}.hero h2{font-size:32px;line-height:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{background:linear-gradient(145deg,#277da1,#101626);border:1px solid #ffffff40;border-radius:15px;aspect-ratio:3/4.2;padding:8px;display:flex;flex-direction:column;text-align:left;font-size:10px}.card svg{width:100%;flex:1;min-height:0}.card b{font-size:12px}.tag{color:#ffd166}dialog{width:min(94vw,400px);padding:20px;background:#0d2035;color:white;border:1px solid #ffffff30;border-radius:24px}dialog::backdrop{background:#030914ed}dialog .card{width:min(70vw,270px);margin:auto}dialog .card b{font-size:18px}.row{display:flex;gap:8px;margin-top:16px}.gold{background:#ffd166;color:#211700}.muted{color:#a4b7cf;font-size:12px}</style><main><h1>Card Empire <small>Sports</small></h1><b id="cash"></b><section class="hero"><p>FOUNDERS SEASON</p><h2>Rip packs.<br>Chase legends.</h2><p class="muted">640 fictional athletes • four sports</p></section><select id="sport"><option>baseball</option><option>basketball</option><option>football</option><option>soccer</option></select><button id="buy" class="gold">Open pack · 5 coins</button><p><button id="work">Sort inventory · earn 1 coin</button></p><h3>Your binder</h3><div id="binder" class="grid"></div><p class="muted">Stylized prototype vector artwork. Original monster edition remains separate.</p></main><dialog id="reveal"><div id="pull"></div><div class="row"><button id="next">Next</button></div></dialog><dialog id="details"><div id="detail"></div><p id="price"></p><div class="row"><button id="hold">Hold</button><button id="sell" class="gold">Sell</button></div></dialog><script>'use strict';const $=x=>document.getElementById(x),sports=['baseball','basketball','football','soccer'],first='Arden Soren Kellan Tavian Lucian Miren Orion Caspian Evren Zephyr Isolde Rhea Nyx Cyrus Elara Vesper Thorne Cassian Aster Ronan Lyra Jasper Callum Nola Sable Ezra Indigo Kairo Marlow Selene Atlas Dario'.split(' '),last='Corvane Ashmantle Stormoak Valehart Emberglass Silverquill Ironreach Nightgale Rookborne Skyforge Grimcrown Sunharvest Ironweaver Hollowspire Brightmoor Wolfcaster Mistral Grayspire Larkspur Everstride'.split(' '),tiers=['Prospect','Prospect','Prospect','Prospect','Prospect','Young Core','Young Core','Star','Superstar','Legend'],weights=[12,12,12,12,12,8,8,4,1,.2],values=[.3,.3,.3,.3,.3,.6,.6,1.5,6,14],par=[['Base',0,9200,1],['Silver Spectrum',0,650,2],['Blue Pulse',199,85,5],['Violet Current',99,35,8],['Gold Crown',50,18,16],['Ember Cut',25,8,28],['Obsidian',10,2.8,55],['Crimson Edge',5,1,100],['Crown Masterpiece',1,.2,300]];const players=sports.flatMap((sport,s)=>Array.from({length:160},(_,i)=>{let n=s*160+i;return{id:sport+'-'+i,name:first[n%32]+' '+last[Math.floor(n/32)],sport,tier:tiers[i%10],weight:weights[i%10],value:values[i%10]}}));let state={cash:100,inv:[],pending:[],prints:{},next:1},index=0,selected=null;try{let s=JSON.parse(localStorage.getItem('empireSportsSimple'));if(s&&Array.isArray(s.inv)&&Array.isArray(s.pending))state=s}catch(e){}function save(){try{localStorage.setItem('empireSportsSimple',JSON.stringify(state))}catch(e){}}function draw(a,w){let r=Math.random()*a.reduce((n,x)=>n+w(x),0);for(let x of a){r-=w(x);if(r<0)return x}return a.at(-1)}function card(){let p=draw(players.filter(x=>x.sport===$('sport').value),x=>x.weight),auto=['Star','Superstar','Legend'].includes(p.tier)&&Math.random()<.01;let key=v=>p.id+'|'+v[0]+'|'+auto,v=draw(par.filter(v=>!v[1]||(state.prints[key(v)]||0)<v[1]),v=>v[2]),serial='';if(v[1]){let k=key(v);state.prints[k]=(state.prints[k]||0)+1;serial=state.prints[k]+'/'+v[1]}return{...p,id:state.next++,variant:v[0],serial,auto,value:Math.round(p.value*v[3]*(auto?8:1)*100)/100}}function face(c){return '<small>'+c.sport+' · '+c.tier+'</small><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#ffffff40"/><circle cx="43" cy="17" r="9" fill="#f4dabd"/><path d="M32 31h23l14 18-10 8-3 32H45V58L30 82l-11-9 17-26-11-9Z" fill="#eaf4ff"/><circle cx="78" cy="65" r="12" fill="#ffd166"/></svg><b>'+c.name+'</b><span class="tag">'+c.variant+' '+c.serial+(c.auto?' AUTO':'')+'</span>'}function render(){$('cash').textContent=state.cash.toFixed(2)+' coins';$('buy').disabled=state.cash<5||state.pending.length>0;$('binder').innerHTML=state.inv.map(c=>'<button class="card" data-id="'+c.id+'">'+face(c)+'</button>').join('')||'<p class="muted">Open a pack to fill your binder.</p>'}function reveal(){if(!$('reveal').open)$('reveal').showModal();$('pull').innerHTML='<div class="card">'+face(state.pending[index])+'</div>';$('next').textContent=index===state.pending.length-1?'Keep pack':'Next card'}$('buy').onclick=()=>{if(state.cash<5||state.pending.length)return;state.cash=Math.round((state.cash-5)*100)/100;state.pending=Array.from({length:5},card);index=0;save();render();reveal()};$('next').onclick=()=>{if(++index<state.pending.length){reveal();return}state.inv.unshift(...state.pending);state.pending=[];save();$('reveal').close();render()};$('reveal').addEventListener('cancel',e=>e.preventDefault());$('binder').onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;selected=state.inv.find(c=>c.id===Number(b.dataset.id));$('detail').innerHTML='<div class="card">'+face(selected)+'</div>';$('price').textContent='Buyer offer: '+selected.value.toFixed(2)+' coins';$('details').showModal()};$('hold').onclick=()=>{$('details').close();selected=null};$('sell').onclick=()=>{if(!selected)return;let i=state.inv.findIndex(c=>c.id===selected.id);if(i<0)return;state.cash=Math.round((state.cash+selected.value)*100)/100;state.inv.splice(i,1);selected=null;save();$('details').close();render()};$('work').onclick=()=>{$('work').disabled=true;$('work').textContent='Sorting…';setTimeout(()=>{state.cash=Math.round((state.cash+1)*100)/100;save();render();$('work').disabled=false;$('work').textContent='Sort inventory · earn 1 coin'},3000)};render();if(state.pending.length)reveal();</script></html>

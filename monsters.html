<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Empire Monsters</title><style>body{margin:0;background:#091426;color:#edf1fa;font:15px system-ui}main{max-width:700px;margin:auto;padding:18px 12px}button,a{font:inherit;padding:13px;background:#dfb965;color:#102033;border:0;border-radius:12px}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{padding:0;background:#172439;color:white;border:1px solid #ffffff40;border-radius:14px;overflow:hidden;text-align:left}svg{display:block;width:100%}footer{padding:8px;font-size:10px}b{display:block}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}dialog{background:#102239;color:white;border:1px solid #ffffff40;border-radius:20px;width:min(85vw,360px)}dialog::backdrop{background:#020817eb}dialog .card{width:min(70vw,250px);margin:auto}dialog footer{font-size:15px}</style><main><h2>Card Empire Monsters</h2><strong id="cash"></strong><p>36 species • 108 art treatments</p><div class="bar"><button id="buy">Open 5 cards · 5 coins</button><button id="work">Sort stock · +1</button><a href="sports.html">Sports</a></div><div id="binder" class="grid"></div><p>Vector artwork pass. Monster and sports balances are separate.</p></main><dialog id="reveal"><div id="pull"></div><button id="next">Next</button></dialog><dialog id="details"><div id="detail"></div><div class="bar"><button id="hold">Hold</button><button id="sell">Sell</button></div></dialog><script>const names='Emberwhelp|Pebblepup|Reedhopper|Mossling|Cindermole|Aquafin|Bramblejack|Sparkgrub|Frostwhisk|Nyxfin|Flameling|Tidehorn|Static Hare|Gloomcap|Verdantail|Emberlynx|Bubblesnare|Stonebeak|Blaze Raptor|Riptide Maw|Volt Stag|Thornmoth|Tundrawyrm|Emberwyrm|Abyss Hydra|Sol Griffin|Umbral Stag|Aurora Rhino|Ironclad Tortoise|Dreamweaver|Starfall Dragon|Tempest Leviathan|Verdant Colossus|Infernal Monarch|Eclipse Chimera|Crown Squall'.split('|');const family=[0,1,2,3,1,4,3,6,1,4,1,1,1,3,0,1,2,5,0,4,1,6,7,7,7,5,1,1,2,6,0,7,3,3,0,5],palette=['#ef773e','#8695aa','#70ac92','#5bac74','#36b9d1','#e2b651','#bfa1de','#9065be'],bodies=['M110 208Q84 152 132 142L163 110 190 134 228 143 201 165Q181 230 133 224L94 259 76 249Z','M68 215Q62 159 133 165L201 151 238 183 209 202 201 251 180 253 157 217 112 224 86 254 60 249Z','M70 200Q150 125 228 200L237 258 175 250 150 271 110 250 58 259Z','M150 107Q236 139 211 215L230 254 179 240 152 267 129 241 79 250 97 217Q63 157 150 107Z','M69 191Q118 120 214 176L244 143 238 227 212 202Q119 268 69 191Z','M147 157L179 113 212 135 177 172 173 230 148 263 124 222Z','M143 123H160L170 246 143 264 132 238Z','M65 244Q231 291 185 208Q93 93 219 139L221 105 267 145 216 170Q150 144 184 179Q266 301 65 266Z'],fins=['M122 165L59 86 69 185 115 198M186 135L217 81 220 130','M176 162L166 90 189 141M205 155L230 115 227 177','M98 222L56 251 106 262M203 222L247 254 194 263','M104 149L92 97 132 122M169 121L213 89 199 155','M127 156L158 116 171 162M131 223L157 259 181 220','M139 179L40 111 55 180 122 209M170 179L261 100 249 173 182 210','M136 159Q65 87 53 171L124 207Q55 187 77 254L135 227M168 159Q243 78 255 171L181 206Q249 186 229 253L170 225','M176 201L220 150 206 227'];const $=x=>document.getElementById(x),rarity=i=>i<10?'Common':i<18?'Uncommon':i<24?'Rare':i<30?'Epic':'Legendary';let s={cash:100,cards:[],pending:[],next:1},selected=null,index=0;try{let a=JSON.parse(localStorage.getItem('empireMonsterArt'));if(a&&Array.isArray(a.cards)&&Array.isArray(a.pending))s=a}catch(e){}function save(){try{localStorage.setItem('empireMonsterArt',JSON.stringify(s))}catch(e){}}function art(c){let i=c.monster,f=family[i],alt=c.variant==='Alt Art',full=c.variant==='Full Art',color=palette[f],land=alt?'M20 420V171L72 110 126 165V420M170 420V100L214 42 277 112V420':'M0 320L64 206 120 282 216 164 300 260V420H0Z';return `<svg viewBox="0 0 300 420"><defs><radialGradient id="g${c.id}"><stop stop-color="${color}"/><stop offset="1" stop-color="#0c1932"/></radialGradient></defs><rect width="300" height="420" fill="url(#g${c.id})"/><circle cx="${alt?65:241}" cy="${alt?77:94}" r="${alt?36:23}" fill="#ffe2b5"/><path d="${land}" fill="#15243c"/><path d="M0 341Q138 295 300 354V420H0Z" fill="#080f22"/><g transform="${alt?'translate(300 12) scale(-1 1)':full?'translate(-18 -22) scale(1.13)':'translate(0 24)'}"><g fill="${color}" stroke="#172238" stroke-width="5"><path d="${fins[f]}"/><path d="${bodies[f]}"/></g><path d="${bodies[f]}" fill="none" stroke="#ffeac2"/><circle cx="191" cy="178" r="6" fill="#0b1930"/><circle cx="193" cy="176" r="2" fill="white"/><path d="M112 201L140 190M130 214L151 204" stroke="#142136" stroke-width="3"/></g></svg>`}function face(c){return art(c)+`<footer><b>${names[c.monster]}</b>${rarity(c.monster)} · ${c.variant}</footer>`}function render(){$('cash').textContent=s.cash.toFixed(2)+' coins';$('buy').disabled=s.cash<5||s.pending.length>0;$('binder').innerHTML=s.cards.map(c=>`<button class="card" data-id="${c.id}">${face(c)}</button>`).join('')||'<p>Open your first monster pack.</p>'}function make(){let roll=Math.random(),start=roll<.76?0:roll<.95?10:roll<.995?18:roll<.9995?24:30,length=start===0?10:start===10?8:6,monster=start+Math.floor(Math.random()*length),v=Math.random(),variant=v<.92?'Base':v<.99?'Full Art':'Alt Art';return{id:s.next++,monster,variant,value:Math.round([.3,.6,1.5,6,14][['Common','Uncommon','Rare','Epic','Legendary'].indexOf(rarity(monster))]*(variant==='Base'?1:variant==='Full Art'?4:8)*100)/100}}function reveal(){if(!$('reveal').open)$('reveal').showModal();$('pull').innerHTML='<div class="card">'+face(s.pending[index])+'</div>';$('next').textContent=index===4?'Keep pack':'Next card'}$('buy').onclick=()=>{if(s.cash<5||s.pending.length)return;s.cash=Number((s.cash-5).toFixed(2));s.pending=Array.from({length:5},make);index=0;save();render();reveal()};$('next').onclick=()=>{if(++index<5){reveal();return}s.cards.unshift(...s.pending);s.pending=[];save();$('reveal').close();render()};$('reveal').addEventListener('cancel',e=>e.preventDefault());$('binder').onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;selected=s.cards.find(c=>c.id===Number(b.dataset.id));$('detail').innerHTML='<div class="card">'+face(selected)+'</div>';$('sell').textContent='Sell '+selected.value.toFixed(2);$('details').showModal()};$('hold').onclick=()=>$('details').close();$('sell').onclick=()=>{let i=s.cards.findIndex(c=>c.id===selected.id);if(i<0)return;s.cash=Number((s.cash+selected.value).toFixed(2));s.cards.splice(i,1);save();$('details').close();render()};$('work').onclick=()=>{$('work').disabled=true;setTimeout(()=>{s.cash++;save();render();$('work').disabled=false},3000)};render();if(s.pending.length)reveal();</script></html>
